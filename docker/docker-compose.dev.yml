name: aggr-server

networks:
  backend:
    name: aggr_backend

services:
  server:
    container_name: aggr-server
    image: aggr-server
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile.dev
      args:
        - WORKDIR=${WORKDIR}
    volumes:
      - ../:${WORKDIR}
    ports:
      - ${PORT}:${PORT}
    env_file:
      - ./.env
    networks:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.3'
          memory: 512M

  influx:
    container_name: aggr-influx
    image: influxdb:1.8.10
    mem_limit: 4g
    mem_reservation: 2g
    memswap_limit: 4g
    ports:
      - ${INFLUX_PORT}:${INFLUX_PORT}
    volumes:
      - ../${FILES_LOCATION}/influxdb:/var/lib/influxdb/
    environment:
      INFLUXDB_DATA_INDEX_VERSION: "tsi1"
      INFLUXDB_DATA_CACHE_MAX_MEMORY_SIZE: "256m"
      INFLUXDB_DATA_CACHE_SNAPSHOT_MEMORY_SIZE: "32m"
      INFLUXDB_DATA_CACHE_SNAPSHOT_WRITE_COLD_DURATION: "5m"
      INFLUXDB_DATA_MAX_CONCURRENT_COMPACTIONS: "1"
      INFLUXDB_RETENTION_CHECK_INTERVAL: "10m"
    networks:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 4g
        reservations:
          cpus: '0.3'
          memory: 2g

  chronograf:
    container_name: aggr-chronograf
    image: chronograf:latest
    volumes:
      - ../${FILES_LOCATION}/chronograf:/var/lib/chronograf
    ports:
      - '8885:8888'
    links:
      - influx
    environment:
      - 'INFLUXDB_URL=http://${INFLUX_HOST}:${INFLUX_PORT}'
    networks:
      - backend
